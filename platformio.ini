[env:firebeetle2_esp32e]
platform = espressif32
; DFR0654 uses ESP32-WROOM-32E with 4 MB flash.
; PlatformIO's "firebeetle32" profile targets the older 16 MB FireBeetle.
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
build_flags =
    ; PNGdec needs two 800-pixel RGBA scanlines: (800 * 4 + 1) * 2 bytes.
    -D PNG_MAX_BUFFERED_PIXELS=6402
lib_deps =
    zinggjm/GxEPD2@1.6.4
    bitbank2/PNGdec@1.1.5
    bblanchon/ArduinoJson@7.4.2
